plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.nhanbiet.sodanhba'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.nhanbiet.sodanhba'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    // pure Android framework, no extra libraries
}
